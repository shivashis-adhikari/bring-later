name: Store package

on:
  push:
    tags: ["v*"]
  workflow_dispatch:

permissions:
  contents: read

jobs:
  msix:
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v7

      - uses: actions/setup-dotnet@v6
        with:
          dotnet-version: "10.0.x"

      - name: Package
        shell: pwsh
        run: windows/packaging/pack.ps1

      - uses: actions/upload-artifact@v7
        with:
          name: store
          path: out/*.msixbundle
